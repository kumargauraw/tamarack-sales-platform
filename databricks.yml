bundle:
  name: tamarack-sales-platform

include:
  - resources/*.yml

sync:
  exclude:
    - .claude
    - tests

variables:
  catalog:
    description: Unity Catalog catalog for this target (dev_tamarack, stg_tamarack or prod_tamarack).
  from_date:
    description: First sale_date the daily load rebuilds (YYYY-MM-DD).
    default: "2026-10-01"

targets:
  # The only target deployed from a developer machine.
  dev:
    default: true
    mode: development
    workspace:
      profile: tamarack-dev
    variables:
      catalog: dev_tamarack

  # Staging and prod are deployed by CI only. CI supplies the workspace host and
  # credentials (DATABRICKS_HOST / service principal) through the environment.
  staging:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: stg_tamarack

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: prod_tamarack
