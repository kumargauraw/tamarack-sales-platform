# CI/CD for the tamarack-sales-platform bundle.
#
#   pull_request -> unit tests + `bundle validate` for staging and prod
#   push to main -> unit tests -> deploy staging + run daily_sales_load -> deploy prod (manual approval)
#
# Authentication is GitHub OIDC workload identity federation: no secrets are stored.
# The Databricks CLI exchanges the GitHub ID token for a Databricks token using the
# service principal's federation policy. Required GitHub configuration:
#   variables:    DATABRICKS_HOST, DATABRICKS_CLIENT_ID (repo level; an environment-level
#                 value with the same name overrides it, e.g. a separate prod principal)
#   environments: staging, prod (prod: required reviewers + deployment branch "main" only)
# Federation policy subjects the service principal must trust (issuer
# https://token.actions.githubusercontent.com, audience = the Databricks account ID):
#   repo:kumargauraw/tamarack-sales-platform:pull_request
#   repo:kumargauraw/tamarack-sales-platform:environment:staging
#   repo:kumargauraw/tamarack-sales-platform:environment:prod

name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  DATABRICKS_AUTH_TYPE: github-oidc
  DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
  DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
  DATABRICKS_CLI_VERSION: "1.25.0"

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      # Fail rather than skip when Spark is unavailable, so the transformation tests always run in CI.
      TAMARACK_REQUIRE_SPARK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run pytest
        run: python -m pytest -rs

  validate:
    name: Validate bundle (${{ matrix.target }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        target: [staging, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@4f41a4c5291b531c1bb1e5760d677999cd484f89 # v1.25.0
        with:
          version: ${{ env.DATABRICKS_CLI_VERSION }}
      - name: Validate
        run: databricks bundle validate --strict --target ${{ matrix.target }}

  deploy-staging:
    name: Deploy staging and run job
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: unit-tests
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@4f41a4c5291b531c1bb1e5760d677999cd484f89 # v1.25.0
        with:
          version: ${{ env.DATABRICKS_CLI_VERSION }}
      - name: Validate
        run: databricks bundle validate --strict --target staging
      - name: Deploy
        run: databricks bundle deploy --target staging
      - name: Run daily_sales_load
        # Waits for the run to finish and fails the workflow if the job fails.
        run: databricks bundle run --target staging daily_sales_load

  deploy-prod:
    name: Deploy prod
    needs: deploy-staging
    runs-on: ubuntu-latest
    # Protected environment: required reviewers must approve before this job starts.
    environment: prod
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@4f41a4c5291b531c1bb1e5760d677999cd484f89 # v1.25.0
        with:
          version: ${{ env.DATABRICKS_CLI_VERSION }}
      - name: Validate
        run: databricks bundle validate --strict --target prod
      - name: Deploy
        # Deploy only; the job runs on its 06:00 UTC schedule in prod.
        run: databricks bundle deploy --target prod
